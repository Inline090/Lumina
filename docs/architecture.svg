<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580" role="img" aria-label="Deployed architecture">
  <defs>
    <style>
      .bg { fill: #faf9f7; }
      .group { fill: none; stroke: #ded9d1; stroke-width: 1; stroke-dasharray: 4 4; }
      .box { fill: #ffffff; stroke: #d8d3ca; stroke-width: 1.4; }
      .box-accent { fill: #ffffff; stroke: #9a6b3f; stroke-width: 1.6; }
      .name { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #2b2926; }
      .sub { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #8a857e; }
      .title { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #2b2926; }
      .lead { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #8a857e; }
      .grouplabel { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; fill: #a8a29a; }
      .edge { stroke: #b8b2a9; stroke-width: 1.4; fill: none; }
      .edge-strong { stroke: #9a6b3f; stroke-width: 1.7; fill: none; }
      .edge-dashed { stroke: #b8b2a9; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
      .edgelabel { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; fill: #8a857e; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8b2a9" />
    </marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a6b3f" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="580" />

  <text class="title" x="40" y="46">Image Processing Service</text>
  <text class="lead" x="40" y="66">Deployed architecture. Every request enters through the API; a separate worker does the image work.</text>

  <rect class="group" x="28" y="88" width="924" height="356" rx="14" />
  <text class="grouplabel" x="44" y="108">AWS ap-south-1</text>

  <rect class="box" x="44" y="250" width="150" height="58" rx="10" />
  <text class="name" x="60" y="276">Browser</text>
  <text class="sub" x="60" y="293">the user</text>

  <rect class="box" x="228" y="250" width="166" height="58" rx="10" />
  <text class="name" x="244" y="276">React client</text>
  <text class="sub" x="244" y="293">static host, Vite build</text>

  <rect class="box-accent" x="428" y="250" width="166" height="58" rx="10" />
  <text class="name" x="444" y="276">Express API</text>
  <text class="sub" x="444" y="293">stateless, JWT, rate limited</text>

  <rect class="box" x="628" y="250" width="110" height="58" rx="10" />
  <text class="name" x="644" y="276">SQS</text>
  <text class="sub" x="644" y="293">transformations</text>

  <rect class="box" x="772" y="250" width="150" height="58" rx="10" />
  <text class="name" x="788" y="276">Lambda worker</text>
  <text class="sub" x="788" y="293">Sharp pipeline</text>

  <rect class="box" x="428" y="140" width="166" height="52" rx="10" />
  <text class="name" x="444" y="163">PostgreSQL</text>
  <text class="sub" x="444" y="179">users, images, jobs</text>

  <rect class="box" x="628" y="140" width="150" height="52" rx="10" />
  <text class="name" x="644" y="163">Google OAuth</text>
  <text class="sub" x="644" y="179">other providers optional</text>

  <rect class="box" x="500" y="360" width="150" height="52" rx="10" />
  <text class="name" x="516" y="383">S3 bucket</text>
  <text class="sub" x="516" y="399">private, signed URLs</text>

  <rect class="box" x="700" y="360" width="120" height="52" rx="10" />
  <text class="name" x="716" y="383">Dead-letter queue</text>
  <text class="sub" x="716" y="399">after 3 tries, alarms</text>

  <rect class="box" x="44" y="360" width="170" height="52" rx="10" />
  <text class="name" x="60" y="383">Resend</text>
  <text class="sub" x="60" y="399">sign-in and batch email</text>

  <path class="edge-strong" d="M 194 279 L 224 279" marker-end="url(#as)" />
  <path class="edge-strong" d="M 394 279 L 424 279" marker-end="url(#as)" />
  <text class="edgelabel" x="396" y="269">HTTPS</text>

  <path class="edge" d="M 511 250 L 511 196" marker-end="url(#a)" />
  <text class="edgelabel" x="518" y="222">SQL</text>

  <path class="edge" d="M 120 250 L 120 220 L 624 220 L 660 220 L 660 196" marker-end="url(#a)" />
  <text class="edgelabel" x="210" y="214">sign in</text>

  <path class="edge" d="M 700 192 L 700 232 L 598 232" marker-end="url(#a)" />
  <text class="edgelabel" x="706" y="214">callback</text>

  <path class="edge-strong" d="M 594 279 L 624 279" marker-end="url(#as)" />
  <text class="edgelabel" x="556" y="270">publish job</text>
  <path class="edge-strong" d="M 738 279 L 768 279" marker-end="url(#as)" />
  <text class="edgelabel" x="742" y="270">batch of 10</text>

  <path class="edge" d="M 511 308 L 511 356" marker-end="url(#a)" />
  <text class="edgelabel" x="518" y="336">put original</text>

  <path class="edge" d="M 683 308 L 683 356" marker-end="url(#a)" />
  <text class="edgelabel" x="690" y="336">3 receives</text>

  <path class="edge-dashed" d="M 440 308 L 440 386 L 218 386" marker-end="url(#a)" />
  <text class="edgelabel" x="250" y="380">sign-in link</text>

  <path class="edge" d="M 816 308 L 816 436 L 654 436" marker-end="url(#a)" />
  <text class="edgelabel" x="742" y="430">result</text>

  <rect x="40" y="486" width="14" height="2.5" fill="#9a6b3f" />
  <text class="lead" x="62" y="490">Request path</text>
  <rect x="160" y="486" width="14" height="2.5" fill="#b8b2a9" />
  <text class="lead" x="182" y="490">Async work and stored files</text>

  <text class="lead" x="40" y="524">The API accepts the upload, queues the job and answers with a job id. The worker is the only process that runs Sharp, so a slow image never holds up a request.</text>
  <text class="lead" x="40" y="542">A failed job is redelivered after the 300 second visibility timeout, reaches the dead-letter queue after three receives, and an alarm emails when that queue is not empty.</text>
  <text class="lead" x="40" y="560">Repeat transforms are served from the jobs table instead of the queue: the key is a digest of the picture and the options, and entries expire after seven days.</text>
</svg>
